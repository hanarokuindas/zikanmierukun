{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <title>時間見えるくん | IT講座 効果可視化ダッシュボード</title>
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1>⏱ 時間見えるくん</h1>
